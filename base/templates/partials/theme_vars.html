{% load navbar_tags %}{% get_theme_settings as theme %}
<!-- Site theme color, admin-configurable under Customize Website > Theme Color -->
<style>
  :root {
    --brand-primary: {{ theme.primary_color|default:"#FCBC00" }};
    --brand-primary-dark: {{ theme.primary_color_dark|default:"#cf9a00" }};
    --brand-primary-rgb: {{ theme.primary_color_rgb|default:"252, 188, 0" }};
    /* Readable gold for text on white, and the text color to put on a primary background */
    --brand-primary-text: {{ theme.primary_color_text|default:"#916c00" }};
    --brand-on-primary: {{ theme.primary_color_on|default:"#14141b" }};
    /* Ink tones from the logo, used for dark hero panels */
    --brand-ink: #14141b;
    --brand-ink-2: #2a2a36;
  }
</style>
